trigger: 

  branches: 
    include: 
    - main
    - feature/*

  paths: 
    include: 
    - '$(WorkDir)'

pool: NovAgent

variables: 
  WorkDir: '$(System.DefaultWorkingDirectory)/environment/dev'
  ServConnect: 'Azure subscription 1(bc524287-f28f-43cf-9bc7-37559e1c0887)'

parameters:
- name: Conditionsb4Authorisation
  displayName: Require tfsec&checkov scan to pass
  type: boolean
  default: false
  values:
    - true
    - false

stages:
  - stage: Build
    displayName: Build
    jobs:
      - job: TerraformInitPlan
        steps:
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(WorkDir)'
            backendServiceArm: '$(ServConnect)'
            backendAzureRmStorageAccountName: 'tfstorage24'
            backendAzureRmContainerName: 'cloudcore'
            backendAzureRmKey: 'dev.tfstate'

        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'validate'
            workingDirectory: '$(WorkDir)'

        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'plan'
            workingDirectory: '$(WorkDir)'
            environmentServiceNameAzureRM: '$(ServConnect)'

  - stage: Scan
    displayName: Scan
    condition: always()
    jobs:
      - job: TfSecCheckov
        displayName: Scanning Tools
        steps:
        - task: tfsec@1
          inputs:
            version: 'v1.26.0'
            dir: '$(WorkDir)'

        - task: PowerShell@2
          inputs:
            targetType: 'inline'
            script: |
              cd $(System.DefaultWorkingDirectory)/environment/dev
              checkov -d .